[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spt-wave-height"
version = "0.1.0"
description = "Spectral Point Transformer for significant wave height estimation from sea clutter"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Yi Zhou"}, {name = "Li Wang"}, {name = "Hang Su"}, {name = "Tian Wang"}]
license = {text = "MIT"}
keywords = ["marine radar", "significant wave height", "transformer", "ocean remote sensing"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24,<3", "torch>=2.1", "pandas>=2.0", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/joeyee/SPT"
Paper = "https://doi.org/10.1109/JOE.2026.3724015"
Repository = "https://github.com/joeyee/SPT"

[project.optional-dependencies]
test = ["pytest>=7.4"]
profile = ["fvcore>=0.1.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
